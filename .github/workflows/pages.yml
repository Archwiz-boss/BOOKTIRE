name: 部署線上試用版

on:
  push:
    branches: [main]
    paths:
      - "cpami-form-editor/web/**"
      - "cpami-form-editor/schema/**"
      - "cpami-form-editor/cpami_core.py"
      - "cpami-form-editor/web_api.py"
      - "web-demo/**"
      - "tools/build_demo.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 試用版與桌面版跑同一份格式引擎；先確認它在 Pyodide 裡仍是逐位元組正確的。
      - name: 驗證格式引擎
        run: |
          python -X utf8 cpami-form-editor/tests/core_unit_test.py
          npm install --no-audit --no-fund
          node cpami-form-editor/tests/demo_pyodide_test.mjs

      - name: 組裝靜態站
        run: python -X utf8 tools/build_demo.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
